name: Unity WebGL Build & Deploy - Self

on:
  push:
    branches: [ web-build ]
  workflow_dispatch:         # 수동 실행 허용

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  build:
    runs-on: self-hosted  # ⭐ Self-hosted Runner 사용
    
    steps:
      # 0. Git Bash를 PATH에 추가 (Windows 호환)
      - name: Add Git Bash to PATH
        shell: cmd
        run: echo C:\Program Files\Git\bin>> "%GITHUB_PATH%"
      
      # 1. 슬랙 알림 (빌드 시작)
      - name: Slack Notification (Start)
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {"text":"🚀 WebGL 빌드 시작","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"🚀 *${{ github.repository }}* 빌드 시작!\n👤 작성자: ${{ github.actor }}"}}]}
      
      # 2. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false  # Library 폴더 보존
      
      # 3. Unity WebGL 빌드 ⭐ 핵심 단계
      - name: Build WebGL
        shell: cmd
        run: |
          "C:\Program Files\Unity\Hub\Editor\6000.0.60f1\Editor\Unity.exe" ^
            -batchmode ^
            -nographics ^
            -quit ^
            -projectPath . ^
            -executeMethod BuildScript.PerformWebGLBuild ^
            -logFile -
      
      # 4. 빌드 결과물 업로드 (Artifact)
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL
      
      # 5. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      # 6. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL
      
      # 7. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        
      # 8. 슬랙 알림 (성공)
      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {"text":"✅ 빌드 성공","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"✅ *${{ github.repository }}* 배포 완료!\n🌐 <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|플레이하기>"}}]}
      
      # 9. 슬랙 알림 (실패)
      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {"text":"❌ 빌드 실패","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"🔥 *${{ github.repository }}* 빌드 실패!\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>"}}]}